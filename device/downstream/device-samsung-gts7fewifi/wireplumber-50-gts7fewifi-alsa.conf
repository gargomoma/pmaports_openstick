# Use the UCM profile instead of ACP: ACP probes all forty DSP PCMs and MultiMedia2 wedges the
# caller in D state. Channels pinned to 2: MultiMedia1 advertises 64 and stereo would spread thin.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
        api.alsa.use-ucm = true
      }
    }
  }
  {
    matches = [
      {
        api.alsa.pcm.card = "0"
      }
    ]
    actions = {
      update-props = {
        audio.channels = 2
        audio.position = [ FL FR ]
        audio.rate = 48000
        audio.format = "S16LE"

        # Hide every PCM on this card by default; only device 0 (MultiMedia1) is re-enabled
        # below. The rest serve the Android HAL's voice paths, and MultiMedia2 wedges on open.
        node.disabled = true
      }
    }
  }
  {
    matches = [
      {
        api.alsa.pcm.card = "0"
        api.alsa.pcm.device = "0"
      }
    ]
    actions = {
      update-props = {
        node.disabled = false
        priority.driver = 2000
        priority.session = 2000
      }
    }
  }

  # hw:0,0 carries both directions; match media.class so the source is not named Speaker.
  {
    matches = [
      {
        api.alsa.pcm.card = "0"
        api.alsa.pcm.device = "0"
        media.class = "Audio/Sink"
      }
    ]
    actions = {
      update-props = {
        node.description = "Speaker"
        node.nick = "Speaker"
      }
    }
  }
  {
    matches = [
      {
        api.alsa.pcm.card = "0"
        api.alsa.pcm.device = "0"
        media.class = "Audio/Source"
      }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Microphone"
        node.nick = "Microphone"
        audio.channels = 1
        audio.position = [ MONO ]
        priority.driver = 2000
        priority.session = 2000
      }
    }
  }

  # Hide the DBMDX voice-wakeup card (card 1): its only PCM is a hotword stream, and it
  # enumerates first, so it would win the default source.
  {
    matches = [
      {
        api.alsa.pcm.card = "1"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
