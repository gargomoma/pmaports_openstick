# The desktop must not react to the power key: powerbutton-daemon owns it, and gsd-power's
# own reaction is a DPMS blank this panel does not survive.
[org/gnome/settings-daemon/plugins/power]
power-button-action='nothing'
sleep-inactive-battery-type='nothing'
sleep-inactive-ac-type='nothing'
sleep-inactive-battery-timeout=0
sleep-inactive-ac-timeout=0
idle-dim=false

# gsd-media-keys grabs XF86PowerOff separately; empty its bindings as a second layer.
[org/gnome/settings-daemon/plugins/media-keys]
power=@as []
power-static=@as []

# enable-suspend gates phosh's Suspend entry independently of polkit and gnome-session.
# Suspend reboots this tablet, so it stays false; the elogind drop-in blocks every other caller.
[sm/puri/phosh]
enable-suspend=false

[org/gnome/desktop/session]
idle-delay=uint32 0

[org/gnome/desktop/screensaver]
idle-activation-enabled=false
lock-enabled=false
