Syntax 3

# Speaker path: MultiMedia1 -> QUAT_TDM_RX_0 -> Cirrus cs35l45 stereo pair (18-0030, 18-0031).
# UCM2 needs a SectionVerb or alsa-lib rejects the profile; AMP PCM Gain item 0 is 10 dB.

SectionVerb {
	EnableSequence [
		cset "name='Left AMP PCM Gain' 0"
		cset "name='Right AMP PCM Gain' 0"
	]

	DisableSequence [
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Built-in stereo speakers (Cirrus cs35l45 x2)"

	# The TDM slot map is required: with the driver defaults the amps read misaligned frames
	# and buzz. Values are Samsung's mixer_paths.xml 'spk' path (RX slots 0/1, TX monitoring).
	EnableSequence [
		cset "name='QUAT_TDM_RX_0 Audio Mixer MultiMedia1' 1"

		cset "name='Left ASPRX1 Slot Position' 0"
		cset "name='Right ASPRX1 Slot Position' 0"
		cset "name='Left ASPRX2 Slot Position' 1"
		cset "name='Right ASPRX2 Slot Position' 0"
		cset "name='Left ASPTX1 Slot Position' 0"
		cset "name='Right ASPTX1 Slot Position' 1"
		cset "name='Left ASPTX2 Slot Position' 2"
		cset "name='Right ASPTX2 Slot Position' 3"
		cset "name='Left ASP_TX1 Source' 3"
		cset "name='Right ASP_TX1 Source' 3"
		cset "name='Left ASP_TX2 Source' 4"
		cset "name='Right ASP_TX2 Source' 4"

		cset "name='Left AMP Enable Switch' 1"
		cset "name='Right AMP Enable Switch' 1"
		cset "name='Left AMP Mute' 0"
		cset "name='Right AMP Mute' 0"
	]

	DisableSequence [
		cset "name='Left AMP Mute' 1"
		cset "name='Right AMP Mute' 1"
		cset "name='Left AMP Enable Switch' 0"
		cset "name='Right AMP Enable Switch' 0"
		cset "name='QUAT_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
		PlaybackPriority 100
	}
}

SectionDevice."Mic" {
	Comment "Built-in digital microphone (DMIC0 via the TX macro)"

	# TX_CDC_DMA_TX_3 Channels must be One: the DMIC route is mono and the ADSP rejects a
	# mismatched port config (ADSP_EBADPARAM). Stereo capture does not work on this device.

	EnableSequence [
		cset "name='TX_CDC_DMA_TX_3 Channels' 0"
		cset "name='TX DMIC MUX0' 1"
		cset "name='TX DEC0 MUX' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
		CaptureRate 48000
		CapturePriority 100
	}
}
