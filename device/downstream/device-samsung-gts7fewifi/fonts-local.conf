<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- /etc/fonts/local.conf: System-wide font aliasing and variable weight mapping -->
<fontconfig>
  <!-- Preferred default fonts -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Cantarell</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
  <!-- Direct Adwaita Sans alias to Cantarell to prevent faux-bolding -->
  <match target="pattern">
    <test name="family">
      <string>Adwaita Sans</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Cantarell</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Adwaita Mono</string>
    </test>
    <edit name="family" mode="assign" binding="same">
      <string>Noto Sans Mono</string>
    </edit>
  </match>
</fontconfig>
