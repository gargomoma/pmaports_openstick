# Never blank: the panel does not come back from FBIOBLANK (noblank.so is the other layer).
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
    Option "NoPM"        "true"
EndSection

Section "Monitor"
    Identifier "panel0"
    Option     "DPMS" "false"
EndSection
