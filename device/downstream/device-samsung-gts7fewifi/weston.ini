# Weston config for gts7fewifi.

[core]
# Weston DPMSes the idle output and this panel does not come back from that.
idle-time=0
require-input=false

[output]
# Virtual-1 is the SDE writeback connector; Weston configures it first and dies there.
name=Virtual-1
mode=off

[output]
name=DP-1
mode=off

[output]
name=DSI-1
mode=preferred
