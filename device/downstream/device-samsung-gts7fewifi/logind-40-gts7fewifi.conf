# elogind drop-in: nothing may suspend this device by any path (suspend reboots it), and the
# power key belongs to powerbutton-daemon (autologin sessions cannot inhibit it).
[Login]
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
IdleAction=ignore

[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
