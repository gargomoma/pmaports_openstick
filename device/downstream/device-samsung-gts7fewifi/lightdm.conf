# Drop-in (lightdm owns lightdm.conf). Autologin: single-user tablet with no keyboard. lightdm
# rather than gdm, whose X fallback assumes a working KMS device.
[LightDM]

[Seat:*]
autologin-user=user
autologin-user-timeout=0
autologin-session=xfce
user-session=xfce
greeter-session=lightdm-gtk-greeter
