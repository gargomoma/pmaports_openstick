# Compila el kernel del OpenStick (msm8916) para postmarketOS.
#
# El aporte en device/testing/linux-postmarketos-qcom-msm8916 lleva el parche que
# habilita CONFIG_USB_ACM=m (driver CDC-ACM, para el ProMicro nRF52840).
#
# La receta sigue la de la propia CI de pmaports (.ci/lib/build_changed_aports.py):
# se llama a `build_init` y luego a `build --arch <arch>`.
#
# El .apk resultante se publica como artifact del workflow.
name: build-kernel-msm8916

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "device/testing/linux-postmarketos-qcom-msm8916/**"
      - ".github/workflows/build-kernel.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    # El enlazado del kernel con ThinLTO solo ya pasa de 30 min en los runners
    # de postmarketOS; aqui damos margen de sobra.
    timeout-minutes: 240

    env:
      # pmbootstrap lee channels.cfg del remote de upstream; aqui se lo damos
      # explicitamente desde este fork, que ya lo trae.
      PMB_CHANNELS_CFG: ${{ github.workspace }}/channels.cfg
      # Fuera del repo, para no ensuciar el arbol de trabajo.
      # (Ruta literal: `runner.*` no está disponible en un env de job.)
      PMB_CFG: /tmp/pmbootstrap.cfg

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del host
        run: |
          sudo apt-get update -qq
          # kpartx es el unico programa obligatorio que no trae el runner
          sudo apt-get install -y -qq kpartx
          # Un kernel + los chroots de pmbootstrap no caben en el disco por
          # defecto del runner; se libera lo que no se va a usar.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /usr/share/swift
          df -h /

      - name: Instalar pmbootstrap
        run: |
          git clone --depth 1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /tmp/pmbootstrap
          sudo ln -sf /tmp/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap
          pmbootstrap --version

      - name: Configurar pmbootstrap (no interactivo)
        run: |
          # pmbootstrap exige un remote que apunte a upstream pmaports
          # (get_upstream_remote lo busca por URL, no por nombre).
          git remote add origin-original \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git
          git fetch -q --depth 1 origin-original main

          # `yes ''` acepta los valores por defecto de todas las preguntas.
          yes '' | pmbootstrap --aports="$GITHUB_WORKSPACE" --config="$PMB_CFG" init

          # Ojo: la UI 'console' implica systemd por defecto, y eso dejaria el
          # canal en 'systemd-edge'. Con openrc el canal es 'edge' (el del equipo).
          pmbootstrap --config="$PMB_CFG" config service_manager openrc
          pmbootstrap --config="$PMB_CFG" config device qcom-msm8916

      - name: Compilar el kernel
        run: |
          pmbootstrap --config="$PMB_CFG" --details-to-stdout --no-ccache \
            --timeout 3600 build_init
          pmbootstrap --config="$PMB_CFG" --details-to-stdout --no-ccache \
            --timeout 3600 build --arch aarch64 --force \
            linux-postmarketos-qcom-msm8916

      - name: Publicar el .apk
        uses: actions/upload-artifact@v4
        with:
          name: kernel-msm8916-aarch64
          path: ~/.local/var/pmbootstrap/packages/*/aarch64/linux-postmarketos-qcom-msm8916-*.apk
          if-no-files-found: error
          retention-days: 30
